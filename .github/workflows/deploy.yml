name: Build and Deploy Astro to GitHub Pages

# Trigger on push to main and allow manual runs from the Actions UI
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and prepare site for GitHub Pages (Astro)
        # Use the official Astro action to install, build and prepare artifacts
        uses: withastro/action@v5

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
